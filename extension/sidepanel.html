<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting Proxy</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 1rem;
    line-height: 1.4;
    font-size: 13px;
  }
  h1 { font-size: 1rem; margin: 0 0 0.75rem; }
  button { font: inherit; padding: 0.35rem 0.8rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
  .ws { font-size: 0.75rem; font-family: ui-monospace, monospace; }
  .ws[data-open="true"] { color: #2a8; }
  .ws[data-open="false"] { color: #c44; }
  .meta { font-size: 0.75rem; color: #888; margin-bottom: 0.75rem; word-break: break-all; }
  ul.notes { list-style: none; padding: 0; margin: 0; }
  ul.notes li {
    padding: 0.5rem 0.6rem;
    border: 1px solid #4444;
    border-radius: 6px;
    margin-bottom: 0.4rem;
  }
  ul.notes li[data-status="completed"] .text {
    text-decoration: line-through;
    opacity: 0.55;
  }
  ul.notes li[data-status="partial"] .text {
    text-decoration: underline dotted;
  }
  .n-meta {
    font-family: ui-monospace, monospace;
    font-size: 0.7rem;
    color: #888;
    margin-top: 0.2rem;
    display: flex;
    gap: 0.75rem;
  }
  .evidence { font-size: 0.75rem; color: #aaa; margin-top: 0.2rem; }
  .status { font-size: 0.75rem; color: #888; min-height: 1em; }
</style>
</head>
<body>

<h1>Meeting Proxy</h1>

<div class="row">
  <button id="start">Start meeting</button>
  <button id="end" disabled>End</button>
  <span class="ws" id="ws" data-open="false">not connected</span>
</div>

<div class="meta" id="meta">meeting_id: —</div>

<ul class="notes" id="notes"></ul>

<div class="status" id="status"></div>

<script src="sidepanel.js" type="module"></script>
</body>
</html>
